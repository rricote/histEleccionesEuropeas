<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Resultados finales de una provincia en las elecciones al Parlamento Europeo: voto, municipios y secciones censales.">
<title>Resultados por provincia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="sitetitle"><a href="index.html">Elecciones al Parlamento Europeo en España</a></div>
  <div class="topbar">
    <nav class="crumbs" id="crumbs" aria-label="Migas de pan"></nav>
  </div>
  <div id="bar"></div>
<nav class="tabs" role="tablist" aria-label="Secciones"><button type="button" role="tab" id="tab-prov" aria-controls="p-prov" aria-selected="true">Provincia</button><button type="button" role="tab" id="tab-muns" aria-controls="p-muns" aria-selected="false" tabindex="-1">Análisis detallado de los municipios o de las secciones censales</button><button type="button" role="tab" id="tab-par" aria-controls="p-par" aria-selected="false" tabindex="-1">Partidos</button></nav>
  <div class="panel" id="p-prov" role="tabpanel" aria-labelledby="tab-prov">
  <div class="mapwrap provwrap">
    <section class="card mapcol">
      <h2 id="mapt">Mapa</h2>
      <div class="seg2" role="group" aria-label="Tipo de mapa"><button type="button" id="vMun" aria-pressed="true">Municipios</button><button type="button" id="vProv" aria-pressed="false">Provincia</button></div>
      <p class="note" id="mapn"></p>
      <svg class="pmap munmap" id="pmap" role="img" aria-label="Mapa de la provincia"></svg>
      <div class="leg2" id="mleg"></div>
      <p class="mapnote" id="mapnote"></p>
    </section>
    <section class="card pd" id="pd"></section>
  </div>
  </div>
  <div class="panel" id="p-muns" role="tabpanel" aria-labelledby="tab-muns" hidden>
  <section class="card" id="pbcard"></section>
  <div class="cols one">
    <section class="card">
      <h2 id="mtt">Municipios de la provincia</h2>
      <p class="note" id="mtn">Pulsa una fila para ver el municipio, con el resultado por secciones censales. Ordena con las cabeceras.</p>
      <label class="fld sel" style="max-width:260px"><span class="lbl">Filtrar por nombre</span><input id="mfilt" class="in" style="border:1px solid var(--rule);padding:7px 9px" placeholder="Escribe…"></label>
      <div class="tw tall"><table class="pt mt mun" id="mtab"></table></div>
    </section>
  </div>
  </div>
  <div class="panel" id="p-par" role="tabpanel" aria-labelledby="tab-par" hidden></div>
  <div class="notes" id="notes"></div>
</div>
<div class="tt" id="tt"></div>
<script src="js/lib.js" charset="utf-8"></script>
<script>
let PO = null, P, C, PJ, MAPM, M = [], MODE = 'mun', ALL = false, SORT = { k: 'censo', d: -1 }, FILT = '';
const PID = (() => { let p = Q.get('p') || DEF_PROV; return /^\d\d$/.test(p) ? p : DEF_PROV })();
if (AUTONOMAS[PID]) nav(hMun(AUTONOMAS[PID]));
const toG = loc => { const g = new Array(NP).fill(0); loc.forEach((v, j) => g[PJ.parties[j]] = v); return g };
function build() {
  M = PJ.m.map(m => { const v = toG(m[5]), w = winOf(v, m[3]), vt = v.reduce((a, b) => a + b, 0) + m[3] + m[4]; return { id: PID + m[0], c3: m[0], n: m[1], censo: m[2], bl: m[3], nu: m[4], v, w, part: m[2] ? vt / m[2] : 0, secs: m[6].length } });
}
function map() {
  const svg = $('#pmap'), MS = MAPM.ms, pw = winOf(P.v, P.bl), byId = {}; M.forEach(m => byId[m.c3] = m);
  svg.setAttribute('viewBox', `0 0 ${MAPM.w} ${MAPM.h}`); svg.classList.toggle('munmap', MODE === 'mun'); svg.classList.toggle('nob', MODE === 'prov');
  $('#vMun').setAttribute('aria-pressed', MODE === 'mun'); $('#vProv').setAttribute('aria-pressed', MODE === 'prov');
  $('#mapt').textContent = MODE === 'mun' ? 'Mapa por municipios' : 'Mapa de la provincia';
  $('#mapn').textContent = MODE === 'mun' ? 'Color: candidatura más votada en cada municipio; cuanto más pálido, menor la ventaja sobre la segunda. Pasa el ratón por un municipio para ver su voto abajo; pulsa para fijarlo.' : 'Color: candidatura más votada en la provincia; el tono refleja su ventaja en votos sobre la segunda.';
  if (MODE === 'prov' && PO && PO[PID] && pw) { const oldp = document.getElementById('upanel'); if (oldp) oldp.remove();
    svg.innerHTML = `<path d="${PO[PID]}" style="${shade(pw.w, pw.m, 0.22)};stroke:none"><title>${esc(P.n)} · ${esc(G.parties[pw.w].n)} ${fmt(pw.sh)} · ventaja ${nf(pw.m * 100, 1)} pts</title></path>`;
    $('#mleg').innerHTML = `<span><i style="background:${pcol(pw.w)}"></i>${esc(G.parties[pw.w].n)}</span>`; $('#mapnote').innerHTML = ''; return }
  const used = new Set(), op = pw ? (/fill-opacity:([\d.]+)/.exec(shade(pw.w, pw.m, 0.22)) || [0, 1])[1] : 1;
  svg.innerHTML = '<g' + (MODE === 'prov' ? ` style="opacity:${op}"` : '') + '>' + MS.map(([c3, name, d]) => { const m = byId[c3]; if (!m || !m.w) return `<path class="nd" d="${d}"><title>${esc(name)} · sin datos</title></path>`;
    if (MODE === 'prov') { used.add(pw.w); return `<path d="${d}" style="fill:${pcol(pw.w)};stroke:${pcol(pw.w)};stroke-width:1px" data-m="${m.id}"><title>${esc(P.n)} · ${esc(G.parties[pw.w].n)} ${fmt(pw.sh)}</title></path>` }
    used.add(m.w.w); return `<path d="${d}" style="${shade(m.w.w, m.w.m)}" data-m="${m.id}" tabindex="0" role="link" aria-label="${esc(name)}"><title>${esc(name)} · ${esc(G.parties[m.w.w].n)} ${fmt(m.w.sh)} · ventaja ${fmt(m.w.m)}</title></path>` }).join('') + '</g>';
  hoverFront(svg);
  const oldp = document.getElementById('upanel'); if (oldp) oldp.remove();
  if (MODE === 'mun') attachPanel(svg, 'path[data-m]', 'm', id => { const m = M.find(x => x.id === id); if (!m) return null;
    return { title: m.n, meta: `${nf(m.censo)} electores · ${nf(m.secs)} ${m.secs === 1 ? 'sección censal' : 'secciones censales'}`, v: m.v, bl: m.bl, nu: m.nu, censo: m.censo, ref: { v: P.v, bl: P.bl }, refName: 'la provincia',
      action: { label: 'Ver detallado por sección censal →', run: () => nav(hMun(m.id)) } } }, 'Pasa el ratón por un municipio para ver su voto al detalle. Pulsa para fijarlo y poder ir a su vista por secciones censales.');
  $('#mleg').innerHTML = [...used].map(i => `<span><i style="background:${pcol(i)}"></i>${esc(G.parties[i].n)}</span>`).join('') + (MODE === 'mun' ? '<span>Más pálido = ventaja más corta</span>' : '');
  const cnt = {}; M.forEach(m => { if (m.w) cnt[m.w.w] = (cnt[m.w.w] || 0) + 1 });
  $('#mapnote').innerHTML = 'Municipios ganados: ' + Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 5).map(i => `<b style="color:${pcol(i)}">${esc(G.parties[i].n)} ${nf(cnt[i])}</b>`).join(' · ');
}
function detail() {
  const multi = C.provs.length > 1, pa = shares(P.v, P.bl), ca = shares(C.v, C.bl), na = shares(G.nat.v, G.nat.bl), vt = pa.valid + P.nu, w = winOf(P.v, P.bl), t2 = w && w.s >= 0 ? w.s : -1;
  let ks = A.order.filter(i => pa.row[i] >= 0.005 || A.order.indexOf(i) < 8); if (ALL) ks = A.order;
  const dif = d => `<span class="${d >= 0 ? 'gd' : 'bd'}">${pts(d) || '0,0'}</span>`;
  $('#pd').innerHTML = `<h3>${esc(P.n)}</h3><div class="meta">${multi ? esc(C.n) : 'Comunidad uniprovincial'} · ${nf(P.censo)} electores${P.cera_censo ? ` (${nf(P.cera_censo)} en el CERA)` : ''} · ${nf(pa.valid)} votos válidos</div>
  <div class="kpis k4"><div><b>${fmt(vt / P.censo)}</b><span>participación (${nf(vt)} votantes de ${nf(P.censo)} electores)</span></div>
  <div><b>${w ? esc(G.parties[w.w].n) : '–'}</b><span>más votado, con ${w ? fmt(w.sh) : '–'} (${w ? nf(P.v[w.w]) : '–'} votos)</span></div>
  <div><b>${w && t2 >= 0 ? nf(P.v[w.w] - P.v[t2]) : '–'}</b><span>votos de ventaja sobre ${t2 >= 0 ? esc(G.parties[t2].n) : '–'}${w && t2 >= 0 ? ` (${nf(w.m * 100, 1)} pts)` : ''}</span></div>
  <div><b>${fmt(P.bl / pa.valid)}</b><span>voto en blanco (${nf(P.bl)}) · ${nf(P.nu)} votos nulos</span></div></div>
  <div class="tw"><table class="pt mt prt vt"><thead><tr><th>Partido</th><th>Votos</th><th>% voto</th>${multi ? '<th title="Diferencia en puntos con la comunidad">Dif. comunidad</th>' : ''}<th>% España</th><th title="Diferencia en puntos con toda España">Dif. España</th><th title="Parte del voto del partido en toda España que sale de esta provincia">Peso en España</th><th title="Escaños del partido en toda España">Escaños (España)</th></tr></thead><tbody>${ks.map(i =>
    `<tr><td><span class="wn">${swatch(i)}${esc(G.parties[i].n)}</span></td><td class="num">${nf(P.v[i])}</td><td class="num"><b>${fmt(pa.row[i])}</b></td>${multi ? `<td class="num">${dif(pa.row[i] - ca.row[i])}</td>` : ''}<td class="num">${fmt(na.row[i])}</td><td class="num">${dif(pa.row[i] - na.row[i])}</td><td class="num">${G.nat.v[i] ? fmt(P.v[i] / G.nat.v[i], 2) : '–'}</td><td class="num s2">${G.nat.es[i] || '–'}</td></tr>`).join('')}</tbody></table></div>
  <p style="margin:10px 0 0"><button type="button" class="ghost" id="allp">${ALL ? 'Mostrar solo los principales' : 'Mostrar todas las candidaturas'}</button></p>
  <p class="note" style="margin:10px 0 0">En las europeas no hay escaños por provincia: España es una circunscripción única. «Dif.» es la diferencia en puntos entre el % de la provincia y el de ${multi ? 'la comunidad o ' : ''}toda España (verde: le va mejor aquí). «Peso» es el porcentaje de los votos del partido en toda España que salen de esta provincia (CERA incluido).</p>
  <p style="margin:14px 0 0" class="navbtns">${multi ? `<a class="btnlk ghost" href="${hCc(C.id)}">← ${esc(C.n)}</a>` : ''}<a class="btnlk ghost" href="${href('index.html')}">← España</a></p>`;
  $('#allp').onclick = () => { ALL = !ALL; detail() };
}
let PBS, PBM = 'mun', A;
function pblock() {
  const ps = G.parties.map((x, i) => i).filter(i => M.some(m => m.v[i] > 0)).sort((a, b) => P.v[b] - P.v[a]).slice(0, 16);
  PBS = PBS || { party: ps[0], ord: 'pct_desc' };
  let units;
  if (PBM === 'mun') units = M.map(m => ({ key: m.id, name: m.n, censo: m.censo, part: m.part, v: m.v, bl: m.bl, nu: m.nu }));
  else { units = []; PJ.m.forEach(mm => mm[6].forEach(s => { const v = toG(s.slice(4)), valid = v.reduce((a, b) => a + b, 0) + s[2];
    units.push({ key: PID + mm[0], name: `${mm[1]} · Dist. ${s[0].slice(0, 2)} Sec. ${s[0].slice(2)}`, censo: s[1], part: s[1] ? (valid + s[3]) / s[1] : 0, v, bl: s[2], nu: s[3] }) })) }
  const mun = PBM === 'mun';
  partyBlock($('#pbcard'), { state: PBS, ps, units, parent: { v: P.v, bl: P.bl }, parentName: 'de la provincia',
    modes: [{ id: 'mun', label: 'Por municipio' }, { id: 'sec', label: 'Por sección censal' }], mode: PBM, onMode: x => { PBM = x; pblock() },
    unitName: mun ? 'Municipio' : 'Sección censal', unitsPl: mun ? 'municipios' : 'secciones censales',
    note: 'El número junto al nombre es su voto en la provincia. Elige un partido, el nivel (municipios o secciones censales) y cómo ordenar: la tabla muestra los diez primeros.',
    chipSub: j => nf(P.v[j]), onRow: id => nav(hMun(id)) });
}
function mtable() {
  const ps = G.parties.map((x, i) => i).filter(i => M.some(m => m.v[i] > 0)).sort((a, b) => P.v[b] - P.v[a]).slice(0, 16);
  const val = m => m.v.reduce((a, b) => a + b, 0) + m.bl;
  const rows = M.filter(m => m.n.toLowerCase().includes(FILT.toLowerCase())).map(m => { const o = { m, censo: m.censo, part: m.part, ganador: m.w ? G.parties[m.w.w].n : '', sh: m.w ? m.w.sh : 0, margen: m.w ? m.w.m : 0, name: m.n, valid: val(m), bl: m.bl, nu: m.nu };
    o.pbl = o.valid ? m.bl / o.valid : 0; ps.forEach(i => o['p' + i] = o.valid ? m.v[i] / o.valid : 0); return o });
  const k = SORT.k; rows.sort((a, b) => (typeof a[k] === 'string' ? a[k].localeCompare(b[k], 'es') : a[k] - b[k]) * SORT.d);
  const th = (key, lab, cls = '') => `<th data-s="${key}" ${SORT.k === key ? `aria-sort="${SORT.d > 0 ? 'ascending' : 'descending'}"` : ''} class="${cls}">${lab}</th>`;
  const cell = (sh, v) => `<td class="num pc">${fmt(sh)}<small>${nf(v)}</small></td>`;
  $('#mtab').innerHTML = `<thead><tr>${th('name', 'Municipio', 'stk')}${th('censo', 'Electores')}${th('part', 'Particip.')}${th('ganador', 'Más votado')}${th('sh', '% ganador')}${th('margen', 'Ventaja')}${ps.map(i => th('p' + i, `<span class="wn">${swatch(i)}${esc(G.parties[i].n)}</span>`)).join('')}${th('pbl', 'En blanco')}${th('nu', 'Nulos')}</tr></thead><tbody>${rows.map(r => `<tr class="rw" data-m="${r.m.id}"><td class="stk">${esc(r.m.n)}</td><td class="num">${nf(r.m.censo)}</td><td class="num">${fmt(r.m.part)}</td><td>${r.m.w ? `<span class="wn">${swatch(r.m.w.w)}${esc(r.ganador)}</span>` : '–'}</td><td class="num">${r.m.w ? fmt(r.sh) : '–'}</td><td class="num">${r.m.w ? nf(r.margen * 100, 1) + ' pts' : '–'}</td>${ps.map(i => cell(r['p' + i], r.m.v[i])).join('')}${cell(r.pbl, r.bl)}<td class="num">${nf(r.nu)}</td></tr>`).join('')}</tbody>`;
  $('#mtab').querySelectorAll('th[data-s]').forEach(t => t.onclick = () => { const kk = t.dataset.s; SORT = { k: kk, d: SORT.k === kk ? -SORT.d : (kk === 'name' || kk === 'ganador' ? 1 : -1) }; mtable() });
  $('#mtab').querySelectorAll('tr.rw').forEach(t => t.onclick = () => { nav(hMun(t.dataset.m)) });
}
let SECP = null;
function partidos() {
  const ps = A.order.slice(0, 16), units = [];
  PJ.m.forEach(mm => mm[6].forEach(x => units.push({ key: mm[0] + x[0], name: `${mm[1]} · Dist. ${x[0].slice(0, 2)} Sec. ${x[0].slice(2)}`, v: toG(x.slice(4)), bl: x[2], link: hMun(PID + mm[0]) })));
  const lv = [{ id: 'mun', label: 'Municipios', one: 'Municipio', pl: 'municipios', labels: false, units: M.map(m => ({ key: m.c3, name: m.n, v: m.v, bl: m.bl, link: hMun(m.id) })),
    draw: (h, st, tx, ti, pk) => ptSvg(h, MAPM.ms.map(x => [x[0], x[2]]), `0 0 ${MAPM.w} ${MAPM.h}`, st, null, ti, pk) }];
  if (SECP) lv.push({ id: 'sec', label: 'Secciones censales', one: 'Sección', pl: 'secciones censales', labels: false, units, draw: (h, st, tx, ti, pk) => ptSvg(h, SECP.s, 'fit', st, null, ti, pk, true) });
  partyTab($('#p-par'), { ps, parent: { name: P.n, short: 'provincia', v: P.v, bl: P.bl }, chipSub: j => nf(G.nat.es[j]) + ' esc.',
    note: 'El número junto al nombre es su número de escaños en España. Elige un partido para ver su porcentaje de voto en cada municipio o sección censal de la provincia.', levels: lv });
}
(async () => {
  try {
    await loadG(); P = G.prov[G.pi[PID]]; C = G.cc[G.ci[P.cc]];
    A = { order: P.v.map((x, i) => i).filter(i => P.v[i] > 0).sort((a, b) => P.v[b] - P.v[a]) };
    [PJ, MAPM, PO] = await Promise.all([loadProv(PID), loadMunMap(PID), jget('mapas/prov_out.json').catch(() => null)]);
    build(); setPill(); document.title = P.n + ' · europeas ' + G.year;
    crumbs(C.provs.length > 1 ? [{ t: 'España', h: href('index.html') }, { l: 'Comunidad', t: C.n, h: hCc(C.id) }, { l: 'Provincia', t: P.n }] : [{ t: 'España', h: href('index.html') }, { l: 'Comunidad', t: C.n }]);
    await mountBar(PID); mountTabs();
    map(); detail(); mtable(); pblock();
    SECP = await loadSecMap(PID); partidos();
    $('#vMun').onclick = () => { MODE = 'mun'; map() }; $('#vProv').onclick = () => { MODE = 'prov'; map() };
    $('#mfilt').oninput = e => { FILT = e.target.value; mtable() };
    $('#notes').innerHTML = notesHTML();
  } catch (e) { console.error(e) }
})();
</script>
</body>
</html>
